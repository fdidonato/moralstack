repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/psf/black
    rev: 26.1.0
    hooks:
      - id: black
        language_version: python3.11

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy moralstack --ignore-missing-imports
        language: system
        pass_filenames: false
      - id: changelog-guard
        name: changelog guard
        entry: python scripts/check_changelog_updated.py
        language: system
        pass_filenames: false
        always_run: true
      - id: memory-guard
        name: memory guard
        entry: python scripts/check_memory_updated.py
        language: system
        pass_filenames: false
        always_run: true
