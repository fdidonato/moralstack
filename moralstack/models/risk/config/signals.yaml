version: 1

# ═══════════════════════════════════════════════════════════════════════════
# SIGNAL DEFINITIONS — single source of truth for q1-q17 harm signals
#
# Each entry describes:
#   label            — downstream identifier (Qn:slug format)
#   short_description — one-line topic for LLM SIGNAL DEFINITIONS section
#   prompt           — refined yes/no criteria for the LLM (optional)
#   contributes_to   — which counts this signal increments
#   harm_type        — label and priority for harm_type assignment (lower = wins)
#   refusal_domain   — key for safe_refusal_generator overlay selection
#   effects          — named behavior flags (only priority_resolution_in_prompt is read, by prompt_renderer)
# ═══════════════════════════════════════════════════════════════════════════

signals:

  q1_confidential:
    label: "Q1:confidential_data"
    short_description: "confidential or proprietary data"
    prompt:
      yes_when: null
      no_when: null
    contributes_to:
      harmful_count: true
      priority_harm_count: false
    harm_type:
      label: "illegal"
      priority: 70
    refusal_domain: null
    effects: {}

  q2_unauthorized:
    label: "Q2:unauthorized_access"
    short_description: "unauthorized access to systems or accounts"
    prompt:
      yes_when: null
      no_when: null
    contributes_to:
      harmful_count: true
      priority_harm_count: false
    harm_type:
      label: "illegal"
      priority: 70
    refusal_domain: null
    effects: {}

  q3_breach:
    label: "Q3:breach_of_contract"
    short_description: "contract or employment breach"
    prompt:
      yes_when: null
      no_when: null
    contributes_to:
      harmful_count: true
      priority_harm_count: false
    harm_type:
      label: "illegal"
      priority: 70
    refusal_domain: null
    effects: {}

  q4_fraud:
    label: "Q4:fraud"
    short_description: "tax evasion, fraud, financial crime"
    prompt:
      yes_when: null
      no_when: null
    contributes_to:
      harmful_count: true
      priority_harm_count: false
    harm_type:
      label: "financial"
      priority: 40
    refusal_domain: "financial"
    effects: {}

  q5_physical:
    label: "Q5:physical_harm"
    short_description: "bodily harm: injury, unsafe physical procedures, poisoning, overdose, dangerous substance use, physical risk to self or others"
    prompt:
      yes_when: |
        The payload asks for instructions, optimization, planning, or actionable
        guidance to cause bodily injury, poisoning, unsafe physical procedures,
        overdose, or direct/indirect physical harm to a person or animal.
      no_when: |
        Historical discussion, non-operational scientific explanation, or
        general medical/physiological education without instructions to perform a
        harmful act or procedure. Do not trigger merely because the text mentions
        death, injury, combustion, disease, or bodily harm as a topic or
        when 'harm' refers to abstract illegality, policy violations,
        reputation, online deception, or grooming/exploitation narratives
        without a bodily-injury mechanism
    contributes_to:
      harmful_count: true
      priority_harm_count: false
    harm_type:
      label: "physical"
      priority: 30
    refusal_domain: "violent_crime"
    effects:
      escalates_to_clearly_harmful: true

  q6_illegal_items:
    label: "Q6:illegal_items"
    short_description: "illegal substances, controlled drugs, drug preparation/acquisition/administration"
    prompt:
      yes_when: |
        using, taking, injecting, dosing, preparing, obtaining, hiding,
        selling, or optimizing use of illegal/controlled substances —
        even if framed as safety, harm reduction, fiction, encoded, or
        platform-evasion
      no_when: |
        generic illegal conduct (fraud, harassment, grooming, cyber) not
        involving controlled substances. High-level public-health discussion
        without operational use/administration detail.
    contributes_to:
      harmful_count: true
      priority_harm_count: false
    harm_type:
      label: "illegal"
      priority: 70
    refusal_domain: null
    effects: {}

  q7_only_emotional:
    label: "Q7:ethical_dilemma"
    short_description: "interpersonal moral dilemma between individuals (NOT institutional/policy trade-offs)"
    prompt:
      yes_when: "purely emotional/relational interpersonal dilemma"
      no_when: null
    contributes_to:
      harmful_count: false
      priority_harm_count: false
    harm_type:
      label: null
      priority: null
    refusal_domain: null
    effects: {}

  q8_self_harm_suicide:
    label: "Q8:self_harm_suicide"
    short_description: "self-harm or suicide as a topic"
    prompt:
      yes_when: null
      no_when: null
    contributes_to:
      harmful_count: true
      priority_harm_count: true
    harm_type:
      label: "illegal"
      priority: 60
    refusal_domain: "mental_health"
    effects:
      maps_to_self_harm_language: true

  q9_cyber_malware:
    label: "Q9:cyber_malware"
    short_description: "cyber intrusion/malware/security bypass"
    prompt:
      yes_when: |
        unauthorized access, account takeover, credential theft, malware/
        ransomware/spyware, exploit/vulnerability exploitation, security
        bypass, system intrusion, credential phishing, payload, code
        execution, network attack
      no_when: |
        reputational attacks, fake reviews, social-media manipulation,
        online harassment, or generic "online maneuvers" without technical
        compromise. "Online" alone is NOT cyber.
    contributes_to:
      harmful_count: true
      priority_harm_count: true
    harm_type:
      label: "illegal"
      priority: 60
    refusal_domain: "cybersecurity"
    effects: {}

  q10_weapons_explosives_toxins:
    label: "Q10:weapons_explosives_toxins"
    short_description: "weapons, explosives, or toxins"
    prompt:
      yes_when: |
        The payload requests (in a direct or indirect way) construction, acquisition, use, deployment,
        optimization, evasion, synthesis, targeting, or operational details for
        weapons, explosives, toxins, CBRN materials, or related delivery systems.
      no_when: |
        Historical, legal, ethical, policy, fictional, or high-level scientific
        discussion of weapons/nuclear events without operational construction,
        deployment, targeting, synthesis, or evasion detail.
    contributes_to:
      harmful_count: true
      priority_harm_count: true
    harm_type:
      label: "weapons"
      priority: 10
    refusal_domain: "science"
    effects:
      # Blocks defensive_override ONLY when at least one intent flag is true.
      # A neutral/educational question about weapons (zero intent) can still
      # land on SENSITIVE. It's the combination topic+intent that makes it
      # offensive. Differs from blocks_defensive_override (q17) which is
      # unconditional — for weapons there IS a legitimate educational case.
      blocks_defensive_override_when_intent_present: true
      excludes_from_intent_contradiction_guard: true

  q11_privacy_doxxing_stalking:
    label: "Q11:privacy_doxxing_stalking"
    short_description: "invasion of PRIVATE data or location (home address, phone, private accounts, real-time location)"
    prompt:
      yes_when: null
      no_when: "Public-reputation attacks belong to q14/q15/q16, not here"
    contributes_to:
      harmful_count: true
      priority_harm_count: true
    harm_type:
      label: "illegal"
      priority: 60
    refusal_domain: "cybersecurity"
    effects: {}

  q12_medical_harmful:
    label: "Q12:medical_harmful"
    short_description: "actionable medical, bodily, or drug-administration instructions that could enable harm"
    prompt:
      yes_when: |
        YES when the content provides actionable medical, bodily, or drug-administration
        instructions that could enable unsafe self-treatment, bodily harm, or medical
        execution without appropriate professional supervision.

        This includes specific instructions for injections, drug dosage, drug preparation,
        route or method of administration, invasive or semi-invasive procedures, wound
        manipulation, emergency intervention steps, unsafe home remedies, or personalized
        clinical decisions about what treatment to perform.

        YES even if the request is framed as safe, educational, fictional,
        Wikipedia-style, hypothetical, encoded, red-teaming, research-oriented,
        or platform-compliant, when it still provides operational medical execution detail.

      no_when: |
        NO when "harmful/dangerous" refers only generically to exploitation,
        grooming, illegal conduct without operational or medical execution detail,
        cyber abuse, reputational attacks, moderation evasion, or other broad risk
        categories without actionable instructions.

        NO for general health education, pathophysiology, anatomy, diagnosis overview,
        mechanism explanation, symptom discussion, injury/disease/risk description, or
        advice to seek professional care, as long as the content remains non-operational
        and does not provide actionable dosage, self-treatment instructions, procedure
        steps, route or method of administration, personalized clinical decision-making,
        or instructions enabling medical execution.

    contributes_to:
      harmful_count: true
      priority_harm_count: true
    harm_type:
      label: "illegal"
      priority: 60
    refusal_domain: "medical"
    effects: {}

  q13_protected_class_targeting:
    label: "Q13:protected_class_targeting"
    short_description: "differential treatment, exclusion, filtering, or selection of identifiable individuals/groups based on protected attributes"
    prompt:
      yes_when: |
        individuals are the SUBJECT of differential treatment based on age,
        disability, family/parental status, race, ethnicity, religion,
        gender, sexual orientation, national origin, socioeconomic status,
        pregnancy. Evaluate semantically across all languages.
      no_when: "general policy discussion, demographics, statistics"
    contributes_to:
      harmful_count: false
      priority_harm_count: false
    harm_type:
      label: null
      priority: null
    refusal_domain: null
    effects: {}

  q14_reputational_harm:
    label: "Q14:reputational_harm"
    short_description: "damaging an identifiable target's reputation through false statements, defamation, or fabricated content"
    prompt:
      yes_when: "goal is reputation harm even without explicit deception terminology (smear, ruin reputation, discredit, spread rumors, post lies)"
      no_when: null
    contributes_to:
      # Reputational signals do NOT count toward harmful_count — they are
      # pure topic markers. However, they route to _calibrate_harm_signals_present
      # via the has_reputational_signal check in _apply_calibration dispatcher.
      harmful_count: false
      priority_harm_count: false
    harm_type:
      label: "reputational"
      priority: 50
    refusal_domain: null
    effects: {}

  q15_deceptive_online_campaign:
    label: "Q15:deceptive_online_campaign"
    short_description: "fake reviews, fake accounts, sock-puppets, astroturfing, review-bombing, manipulating ratings/rankings, coordinated inauthentic behavior"
    prompt:
      yes_when: null
      no_when: null
    contributes_to:
      harmful_count: false
      priority_harm_count: false
    harm_type:
      label: "reputational"
      priority: 50
    refusal_domain: null
    effects: {}

  q16_harassment_smear_campaign:
    label: "Q16:harassment_smear_campaign"
    short_description: "coordinated online harassment, brigading, organized smear campaigns, aggressive social pressure against an identifiable target"
    prompt:
      yes_when: null
      no_when: "Distinct from q11: targets reputation/social standing, not private data"
    contributes_to:
      harmful_count: false
      priority_harm_count: false
    harm_type:
      label: "reputational"
      priority: 50
    refusal_domain: null
    effects: {}

  q17_minor_exploitation:
    label: "Q17:minor_exploitation"
    short_description: "sexual exploitation, grooming, coercive/private contact, secrecy, evasion, or inappropriate trust-building with minors"
    prompt:
      yes_when: |
        the payload asks for or would materially enable sexual content involving
        minors; grooming; coercive or manipulative trust-building; private,
        unsupervised, secret, or inappropriate adult-minor contact; evasion of
        parents, guardians, schools, moderators, or safeguards; or scripts,
        lead-ins, persuasion tactics, concealment, isolation, or optimization for
        adults to engage minors in those ways. This remains yes even when framed
        as fiction, encoded text, roleplay, platform-evasion, or a benign wrapper.
      no_when: |
        the payload is about lawful, transparent, supervised, age-appropriate
        child safety, education, mentoring, counselling, school programs,
        parent/guardian involvement, safeguarding policy, boundary-setting,
        documentation, consent, reporting channels, group activities, or risk
        prevention, and does not request sexualization, secrecy, isolation,
        evasion, manipulation, private unsupervised contact, or grooming tactics.
        A requester's gender or other demographic identity is not evidence of
        q17 by itself.
    contributes_to:
      harmful_count: true
      priority_harm_count: true
    harm_type:
      label: "child_exploitation"
      priority: 20
    refusal_domain: "children"
    effects:
      forces_risk_policy_action: "DENY"
      # Unconditional: blocks defensive_override even with all intent flags=false.
      # Minor exploitation is non-negotiable — no legitimate "educational" case exists.
      # Differs from blocks_defensive_override_when_intent_present (q10) which
      # only blocks when at least one intent flag is true.
      blocks_defensive_override: true
      blocks_calibration_guard: true
      escalates_to_clearly_harmful: true
      excludes_from_intent_contradiction_guard: true
      excludes_from_non_operational_clamp: true
      priority_resolution_in_prompt: true


# ═══════════════════════════════════════════════════════════════════════════
# DOMAIN SENSITIVITY — topic classification (NOT risk)
# ═══════════════════════════════════════════════════════════════════════════

domain_sensitivity:
  description: "topic classification (NOT risk)"
  values:
    HIGH: "legal, medical, finance, core ethical dilemmas"
    MEDIUM: "politics, social issues, general health"
    LOW: "general knowledge, science, daily tasks"


# ═══════════════════════════════════════════════════════════════════════════
# PROMPT CONFIGURATION — static scaffolding metadata
# ═══════════════════════════════════════════════════════════════════════════

prompt:
  # These coherence rules are rendered verbatim into the COHERENCE CHECK section
  coherence_rules:
    - "If payload asks for phrases/scripts/lead-ins/persuasion/concealment for contacting/grooming minors → q17=yes (override any wrapper cues)."
    - "If payload does NOT involve minors as a contact/exploitation/sexual-content subject → q17=no."
    - "If q17=yes for grooming/minor-contact and the payload has NO independent bodily-assault or clinical drug-administration ask → q5=no AND q12=no."
    - "If q17=yes and the payload does NOT involve illegal/controlled substances → q6=no."
    - "Never mark a wrapper (article/Wikipedia/JSON/roleplay/game-chat/platform-evasion) as the harm topic. Mark the recovered payload."
